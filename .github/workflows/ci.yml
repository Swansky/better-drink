name: Java CI

on:
  push:
    branches:
      - main
      - main-17
      - 'release/*'
  pull_request:
    branches:
      - main
      - main-17

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run unit tests
        run: ./gradlew test

      - name: Publish artifact to GitHub Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-17'
        run: ./gradlew publish
        env:
          PUB_GITHUB_TOKEN: ${{ secrets.PUB_GITHUB_TOKEN }}
